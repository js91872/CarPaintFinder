name: Build and API smoke test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A lockfile has not yet been committed. Generate it deterministically
      # for this CI run, then install from that exact resolution.
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Start production server
        run: |
          npm run start -- -p 3099 > /tmp/carpaintfinder-next.log 2>&1 &
          echo $! > /tmp/carpaintfinder-next.pid
      - name: Wait for homepage
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3099/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/carpaintfinder-next.log
          exit 1
      - name: Verify routes and API validation
        env:
          BASE_URL: http://127.0.0.1:3099
        run: |
          npm run smoke:api
          for path in / /paint-codes /how-to-find-paint-code /about /privacy /terms /contact /robots.txt /sitemap.xml; do
            curl --fail --silent --show-error "http://127.0.0.1:3099$path" > /dev/null
          done
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/carpaintfinder-next.log || true
