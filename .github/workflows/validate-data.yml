name: Validate paint data
on:
  push:
    paths:
      - 'data/**'
      - 'scripts/validate-import.mjs'
      - '.github/workflows/validate-data.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/validate-import.mjs'
      - '.github/workflows/validate-data.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-import.mjs data/import-example.json
      - run: node scripts/validate-location-candidates.mjs data/location-candidates-oem-2024-2025.json
      - run: node scripts/validate-location-candidates.mjs data/location-candidates-ford-2017.json
